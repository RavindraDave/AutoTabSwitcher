<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Auto Tab Switcher</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <script type="module" src="popup.js"></script>
  </head>

  <body>
    <div class="container mt-3 mb-2">
      <div class="card">
        <div class="card-header">
          <strong>Auto Tab Switcher</strong>
        </div>
        <div class="card-body">
          <!-- Delay Time Input -->
          <div class="form-group">
            <label for="delayTimeInput" class="font-weight-bold">
              Delay Time (seconds)
            </label>
            <input
              type="number"
              class="form-control"
              id="delayTimeInput"
              placeholder="Enter delay time in seconds"
              min="5"
              max="3600"
            />
            <small class="form-text text-muted" id="delayHelpText">
              Time between tab switches (Range: <span id="minDelayDisplay">5</span>-3600 seconds)
            </small>
          </div>

          <!-- Enabled Toggle -->
          <div class="form-group">
            <div class="custom-control custom-switch">
              <input type="checkbox" class="custom-control-input" id="enabledCheckbox">
              <label class="custom-control-label font-weight-bold" for="enabledCheckbox">
                Enable Auto-Switching
              </label>
            </div>
            <small class="form-text text-muted">
              Turn automatic tab switching on/off (changes save immediately)
            </small>
          </div>

          <!-- Environment Info (if available) -->
          <div id="environmentInfo"></div>

          <!-- Success Message -->
          <div id="successMessage" class="alert alert-success" role="alert" style="display: none;"></div>

          <!-- Error Message -->
          <div id="errorMessage" class="alert alert-danger" role="alert" style="display: none;"></div>

          <!-- Save Button -->
          <button type="button" class="btn btn-primary btn-block" id="saveButton">
            💾 Save
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Link -->
    <div class="settings-link">
      <a href="#" id="moreSettingsLink">⚙️ More Settings</a>
    </div>
  </body>
</html>
