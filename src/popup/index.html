<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Tab Switcher</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/popup.css">
</head>
</head>

<body>
    <div class="popup-container">
        <div class="header" id="header">
            <h1>Auto Tab Switcher</h1>
            <div class="status-badge" id="statusBadge">LOADING...</div>
        </div>

        <div class="segmented-control-container">
            <div class="segmented-control">
                <button class="segment-btn active" id="modeGlobalBtn">Global</button>
                <button class="segment-btn" id="modeWindowBtn">Window</button>
            </div>
        </div>
        <div class="content">
            <!-- Window Info Alert (shown when popup opened on non-monitored window) -->
            <div class="window-info-alert" id="windowInfoAlert">
                <div class="alert-title">
                    <span>ℹ️</span>
                    <span>This Window Is Not Being Monitored</span>
                </div>
                <div class="alert-text" id="windowInfoText">
                    Auto-switching is active in a different window.
                </div>
                <div class="monitored-window" id="monitoredWindowInfo"></div>
            </div>

            <div class="status-card" id="statusCard">
                <div class="status-icon" id="statusIcon">🔄</div>

                <!-- Countdown Ring (only shown when active/paused) -->
                <div class="countdown-ring" id="countdownRing">
                    <svg class="countdown-svg" viewBox="0 0 80 80">
                        <defs>
                            <linearGradient id="gradient-active" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="gradient-active-window" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#20B2AA;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#3CB371;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="gradient-paused" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle class="countdown-circle-bg" cx="40" cy="40" r="36" />
                        <circle class="countdown-circle" id="countdownCircle" cx="40" cy="40" r="36"
                            style="stroke: url(#gradient-active);" />
                    </svg>
                    <div class="pulse" id="pulse"></div>
                    <div class="countdown-number" id="countdownNumber">--</div>
                    <div class="countdown-label" id="countdownLabel">seconds</div>
                </div>

                <div class="status-text" id="statusText">Loading...</div>
            </div>

            <div class="toggle-section">
                <button class="toggle-button" id="toggleButton">Toggle</button>
            </div>

            <!-- Advanced Options and Back to Global sections removed -->

            <div class="info-row">
                <span class="info-label">
                    <span class="info-icon">🪟</span>
                    <span>Mode</span>
                </span>
                <span class="info-value" id="modeValue">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">
                    <span class="info-icon">⏱️</span>
                    <span>Interval</span>
                </span>
                <span class="info-value" id="intervalValue">--</span>
            </div>

            <button class="settings-button" id="settingsButton">⚙️ Open Settings</button>

            <div style="text-align: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0;">
                <a href="../options/diagnostics.html" target="_blank"
                    style="color: #667eea; text-decoration: none; font-size: 13px;">🔍 View Diagnostics</a>
            </div>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
