<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Design C - Bold Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .popup-container {
            width: 280px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .status-hero {
            padding: 32px 24px;
            text-align: center;
            position: relative;
            color: white;
        }

        .status-hero.active {
            background: linear-gradient(135deg, #4CAF50 0%, #2e7d32 100%);
        }

        .status-hero.paused {
            background: linear-gradient(135deg, #FF9800 0%, #ef6c00 100%);
        }

        .status-hero.inactive {
            background: linear-gradient(135deg, #9E9E9E 0%, #616161 100%);
        }

        .status-icon-large {
            font-size: 64px;
            margin-bottom: 16px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .status-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .status-subtitle {
            font-size: 13px;
            opacity: 0.9;
        }

        .countdown-ring {
            margin: 16px auto 0;
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .countdown-number {
            font-size: 24px;
            font-weight: 700;
        }

        .content {
            padding: 24px;
        }

        .action-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .action-button.stop {
            background: #f44336;
            color: white;
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }

        .action-button.start {
            background: #4CAF50;
            color: white;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .quick-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .quick-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .quick-info-row:not(:last-child) {
            border-bottom: 1px solid #e9ecef;
        }

        .info-label-bold {
            font-size: 12px;
            color: #6c757d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value-bold {
            font-size: 14px;
            color: #212529;
            font-weight: 700;
        }

        .settings-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: #f8f9ff;
        }

        .label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
            text-align: center;
        }

        .pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.9);
                opacity: 1;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Active State -->
    <div class="popup-container">
        <div class="status-hero active">
            <div class="status-icon-large">🔄</div>
            <div class="status-title">ACTIVE</div>
            <div class="status-subtitle">Auto-switching tabs</div>
            <div class="countdown-ring">
                <div class="pulse"></div>
                <div class="countdown-number">45</div>
            </div>
        </div>
        <div class="content">
            <button class="action-button stop">⏹ Stop Switching</button>

            <div class="quick-info">
                <div class="quick-info-row">
                    <span class="info-label-bold">Mode</span>
                    <span class="info-value-bold">Current Window</span>
                </div>
                <div class="quick-info-row">
                    <span class="info-label-bold">Interval</span>
                    <span class="info-value-bold">60s</span>
                </div>
            </div>

            <button class="settings-btn">⚙️ Settings</button>
        </div>
    </div>

    <div class="label">Design C - Active State</div>

    <!-- Paused State -->
    <div class="popup-container">
        <div class="status-hero paused">
            <div class="status-icon-large">⏸️</div>
            <div class="status-title">PAUSED</div>
            <div class="status-subtitle">User activity detected</div>
            <div class="countdown-ring">
                <div class="countdown-number">25</div>
            </div>
        </div>
        <div class="content">
            <button class="action-button stop">⏹ Stop Switching</button>

            <div class="quick-info">
                <div class="quick-info-row">
                    <span class="info-label-bold">Mode</span>
                    <span class="info-value-bold">Global</span>
                </div>
                <div class="quick-info-row">
                    <span class="info-label-bold">Interval</span>
                    <span class="info-value-bold">90s</span>
                </div>
            </div>

            <button class="settings-btn">⚙️ Settings</button>
        </div>
    </div>

    <div class="label">Design C - Paused State</div>

    <!-- Inactive State -->
    <div class="popup-container">
        <div class="status-hero inactive">
            <div class="status-icon-large">⏹️</div>
            <div class="status-title">DISABLED</div>
            <div class="status-subtitle">Click below to start</div>
        </div>
        <div class="content">
            <button class="action-button start">▶️ Start Switching</button>

            <div class="quick-info">
                <div class="quick-info-row">
                    <span class="info-label-bold">Mode</span>
                    <span class="info-value-bold">Global</span>
                </div>
                <div class="quick-info-row">
                    <span class="info-label-bold">Interval</span>
                    <span class="info-value-bold">60s</span>
                </div>
            </div>

            <button class="settings-btn">⚙️ Settings</button>
        </div>
    </div>

    <div class="label">Design C - Disabled State</div>
</body>
</html>
